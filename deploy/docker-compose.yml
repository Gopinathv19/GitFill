# GitFill on one VPS, behind the host's nginx.
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d --build
#
# Web and workers run from the same image as separate services, so a long deck render never
# blocks the web app and each can be restarted on its own. Nothing is published on a public
# interface: nginx on the host proxies to 127.0.0.1:${GITFILL_PORT}. Postgres is only reachable
# inside the compose network.

name: gitfill

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: gitfill:latest
  env_file: .env.production
  environment:
    DATABASE_URL: postgresql://gitfill:${POSTGRES_PASSWORD}@postgres:5432/gitfill
    ARTIFACT_STORAGE_PATH: /data
    INLINE_WORKER: "false"
    NODE_ENV: production
  volumes:
    - gitfill-data:/data
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gitfill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
      POSTGRES_DB: gitfill
    volumes:
      - gitfill-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitfill -d gitfill"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    shm_size: 256mb
    deploy:
      resources:
        limits: { memory: 3g, cpus: "2" }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Applies database migrations once per deploy, then exits.
  migrate:
    <<: *app
    command: ["node_modules/.bin/tsx", "scripts/migrate.ts"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: ["node_modules/.bin/next", "start", "-p", "8080", "-H", "0.0.0.0", "--keepAliveTimeout", "65000"]
    init: true
    ports:
      - "127.0.0.1:${GITFILL_PORT:-3100}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 4g, cpus: "3" }

  # Each worker runs one job at a time (claimed with SKIP LOCKED, so several are safe).
  # Deck and video jobs drive headless Chromium: give it shared memory and room.
  worker:
    <<: *app
    # tsx directly (not npm → sh → tsx) under tini, so SIGTERM reaches the worker and it finishes its job.
    command: ["node_modules/.bin/tsx", "scripts/worker.ts"]
    init: true
    shm_size: 1gb
    stop_grace_period: 5m
    deploy:
      replicas: ${GITFILL_WORKERS:-2}
      resources:
        limits: { memory: 6g, cpus: "3" }

volumes:
  gitfill-data:
  gitfill-pg:
