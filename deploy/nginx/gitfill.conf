# /etc/nginx/sites-available/gitfill.conf — its own server block, so the app already on this
# host keeps its config untouched. Replace gitfill.example.com with your domain, then:
#   sudo ln -s /etc/nginx/sites-available/gitfill.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gitfill.example.com     # adds the 443 block and the redirect

upstream gitfill {
    server 127.0.0.1:3100;  # must equal GITFILL_PORT in deploy/.env.production
    keepalive 16;
    keepalive_timeout 30s;  # below the app's 65 s keep-alive, so nginx never reuses a closed connection
}

server {
    listen 80;
    listen [::]:80;
    server_name gitfill.example.com;

    # Uploads: images up to 10 MB, documents and .pptx templates up to 15 MB.
    client_max_body_size 20m;

    # Chat turns stream their progress and can run for minutes while the agent scouts the repository.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://gitfill;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;  # pinned to server_name, never the client's Host header
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app uses no WebSockets: never forward Upgrade (prevents h2c smuggling) and keep
        # Connection empty so the upstream keepalive pool is used.
        proxy_set_header Connection "";
        # Streamed responses must reach the browser as they are written.
        proxy_buffering off;
        proxy_cache off;
    }

    # Next.js build assets are content-hashed: cache them hard.
    location /_next/static/ {
        proxy_pass http://gitfill;
        proxy_set_header Host $server_name;  # pinned to server_name, never the client's Host header
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
